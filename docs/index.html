  <body>
    <div id="app"></div>
    <script>
      // Belt-and-braces zoom suppression: iOS Safari ignores `user-scalable=no`,
      // so block the gestures that trigger zoom directly.
      // Pinch-zoom (Safari proprietary gesture events)
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) =>
        document.addEventListener(ev, (e) => e.preventDefault(), { passive: false })
      );
      // Pinch-zoom via multi-touch
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1 && e.cancelable) e.preventDefault();
      }, { passive: false });
      // Double-tap-to-zoom
      let _lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - _lastTouchEnd < 350 && e.cancelable) e.preventDefault();
        _lastTouchEnd = now;
      }, { passive: false });
    </script>
